name: .NET CI

on:
  push:
    branches: [ main, part3-mvc ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore

      - name: Build the MVC project
        run: dotnet build RaceDayMvc/RaceDayMvc.csproj --no-restore --configuration Release

      - name: Build the whole solution (API, MVC and tests)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
